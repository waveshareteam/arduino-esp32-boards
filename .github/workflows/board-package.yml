name: Board package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "New release version (MAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ESP32_CORE_VERSION: '4.0.0'
      VERSION: ${{ inputs.version || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: '1.6.0'
      - name: Cache Espressif downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/espressif-downloads
          key: arduino-esp32-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ESP32_CORE_VERSION }}
      - name: Build the archive and indexes
        run: python scripts/package.py "$VERSION" dist
      - name: Install through Boards Manager and compile
        shell: bash
        run: |
          export ARDUINO_DIRECTORIES_DATA="$RUNNER_TEMP/arduino-data"
          export ARDUINO_DIRECTORIES_USER="$RUNNER_TEMP/arduino-sketchbook"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$RUNNER_TEMP/espressif-downloads"
          python -m http.server 8765 --bind 127.0.0.1 --directory dist &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          index='http://127.0.0.1:8765/package_waveshare_test_index.json'
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 "$index" -o /dev/null
          urls="https://espressif.github.io/arduino-esp32/package_esp32_index.json,$index"
          arduino-cli core update-index --additional-urls "$urls"
          arduino-cli core install "esp32:esp32@$ESP32_CORE_VERSION" --additional-urls "$urls"
          export ARDUINO_DIRECTORIES_DOWNLOADS="$RUNNER_TEMP/waveshare-downloads"
          arduino-cli core install "waveshare:esp32@$VERSION" --additional-urls "$urls"
          arduino-cli compile --fqbn waveshare:esp32:waveshare_esp32_p4_wifi6_db_touch_lcd_10_1 examples/board_check
      - uses: actions/upload-artifact@v4
        with:
          name: board-package
          path: |
            dist/*.zip
            dist/package_waveshare_index.json

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-board-package
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: board-package
          path: dist
      - name: Publish the archive and update the public index
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          gh release create "v$VERSION" "dist/waveshare-esp32-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "Waveshare ESP32 Boards $VERSION" \
            --prerelease --generate-notes
          cp dist/package_waveshare_index.json package_waveshare_index.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package_waveshare_index.json
          git commit -m "Publish board package $VERSION"
          git push origin HEAD:main

  mirror_gitee:
    needs: publish
    uses: ./.github/workflows/mirror-gitee.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
